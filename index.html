      { no: 403, word: "上方", desc: "京都・大阪とその周辺の地域をさす呼び方。江戸時代には、元禄文化が栄えた。", type:"place" },
      { no: 404, word: "井原西鶴", desc: "江戸時代中期の浮世草子作家。町人の生活や欲望のありままの姿を「浮世草子」とよばれる小説に著した。代表作は「好色一代男」「日本永代蔵」。", type:"person" },
      { no: 405, word: "浮世草子", desc: "江戸時代の小説の一種。17世紀末の井原西鶴の「好色一代男」を最初に、約100年間上方で栄えた。武士や町人の現実生活などをありのまま描いた。", type:"work" },
      { no: 406, word: "近松門左衛門", desc: "江戸時代中期の人形浄瑠璃・歌舞伎の台本作家。義理と人情の板挟みに悩む男と女の姿をえがき、人々に大きな感動を与えた。代表作は「曽根崎心中」。", type:"person" },
      { no: 407, word: "松尾芭蕉", desc: "江戸時代前期の俳人。伊賀上野（三重県）から江戸にでて本格的に俳諧をまなび、芸術性豊かな文学に高めた。代表作は「奥の細道」「笈の小文」。", type:"person" },
      { no: 408, word: "俳諧", desc: "五・七・五の17音で自然や感情を表現する短い詩。室町時代の連歌から分かれて始まったが、元禄時代に松尾芭蕉によって芸術まで高められた。", type:"concept" },
      { no: 409, word: "奥の細道", desc: "松尾芭蕉の俳諧紀行文。弟子の曽良をともなって、江戸から東北地方・北陸地方をへて大垣（岐阜県）に至るまでの5ヶ月間にわたる旅日記。", type:"work" },
      { no: 410, word: "尾形光琳", desc: "江戸時代中期の画家・工芸家。大和絵風のはなやかな装飾画を大成した。代表作は「紅白梅図屏風」「燕子花図屏風」「八橋蒔絵すずり箱」。", type:"person" },
      { no: 411, word: "浮世絵", desc: "江戸時代の風俗画。町人の風俗や役者・力士などを題材にしてえがかれ、元禄時代に菱川師宣によって大成された。", type:"concept" },
      { no: 412, word: "菱川師宣", desc: "江戸時代前期の浮世絵師。町人や役者を題材に、風俗画に新しい様式を加えて浮世絵として大成した。代表作は「見返り美人図」。", type:"person" },

      { no: 414, word: "徳川吉宗", desc: "江戸幕府8代将軍。紀伊（和歌山県）徳川家から将軍となった。家康時代を理想に享保の改革をおこなった。米の価格安定に力を注いだので米将軍とよばれた。", type:"person" },
      { no: 415, word: "公事方御定書", desc: "徳川吉宗がつくらせた幕府の基本法典。それまで慣習にたよっていた裁判制度などを改めるため、これまでの幕府の法令や裁判の結果をまとめたもの。", type:"work" },

      { no: 419, word: "小作人", desc: "地主から田畑を借りて耕作する農民。田畑の使用料はおもに米で納めていた。", type:"concept" },
      { no: 420, word: "問屋制家内工業", desc: "江戸時代中頃に始まった生産方法。商人や地主が農民に原料の糸や機械を貸して、できた製品を買い上げた。", type:"concept" },
      { no: 421, word: "工場制手工業", desc: "分業による生産の方法で、マニュファクチュアともいう。江戸時代後期には、地主や問屋商人が作業場に農民を労働者として集めて効率よく生産した。", type:"concept" },
      { no: 422, word: "百姓一揆", desc: "江戸時代、農民による集団での領主への抵抗。ききんのあとに多く発生し、年貢の軽減や不正役人の交代などの要求をかかげて領主のもとへ押し寄せた。", type:"event" },
      { no: 423, word: "打ちこわし", desc: "おもに都市に住む人々が起こした反抗行動。米の値上がりなどに苦しむ人々が集団で米を買い占める大商人などを襲い、米を出させたり、売り渋りを要求した。", type:"event" },
      { no: 424, word: "田沼意次", desc: "18世紀後半の幕府の老中。財政の立て直しのため、商工業者の株仲間を認める代わりに一定の税をとった。さらに印旛沼などの干拓を行い、長崎貿易を奨励した。しかし「わいろ」がさかんになり政治が乱れた。", type:"person" },

      { no: 426, word: "天明のききん", desc: "1782〜87年に起こった全国的な大ききん。冷害などの天候不順に浅間山の大噴火などが重なって数年間にわたる全国的なきき んとなった。各地で百姓一揆・打ちこわしが続発し、田沼意次の失脚を早めることにもなった。", type:"event" },

      { no: 431, word: "国学", desc: "日本の古典を研究して、儒教・仏教の影響を受ける前の日本古来の思想を明らかにしようとする学問。18世紀後半に本居宣長によって大成された。", type:"concept" },
      { no: 432, word: "本居宣長", desc: "江戸時代中期の国学の大成者。「古事記」の中に日本古来の考え方があるとしてその研究を始め、「古事記伝」を完成させて国学を大成した。", type:"person" },
      { no: 433, word: "蘭学", desc: "江戸時代中期以降さかんになった、オランダ語によって研究された西洋の学問。「解体新書」によって基礎が築かれた。", type:"concept" },

      { no: 435, word: "解体新書", desc: "日本で最初の西洋医学の翻訳書。1774年刊。杉田玄白・前野良沢らがオランダ語の人体解剖書「ターヘル＝アナトミア」を翻訳したもの。", type:"work" },

      { no: 440, word: "喜多川歌麿", desc: "江戸時代後期の浮世絵師。顔を主体に女性の半身図を描く大首絵を得意とし、美人画の第一人者。代表作は「婦女人相十品」。", type:"person" },
      { no: 441, word: "歌川（安藤）広重", desc: "江戸時代後期の浮世絵師。風景画にすぐれ、風景を版画にした作品は旅への関心とともに庶民の人気をあつめた。代表作は「東海道五十三次」。", type:"person" },
      { no: 442, word: "葛飾北斎", desc: "江戸時代後期の浮世絵師。風景画にすぐれた。代表作は「富嶽三十六景」。", type:"person" },
      { no: 443, word: "十返舎一九", desc: "江戸時代後期の作家。滑稽本を得意とした。代表作は「東海道中膝栗毛」。", type:"person" },
      { no: 444, word: "滝沢馬琴", desc: "江戸時代後期の作家。歴史や伝説を題材とした「読本」とよばれる長編小説をあらわした。代表作は「南総里見八犬伝」。", type:"person" },
      { no: 445, word: "瓦版", desc: "江戸時代、木版ですられた印刷物。現在の新聞のようなもので、災害やあだうちなどのニュースを挿絵入りで一枚に刷り、町で読み上げながら売りさばいた。", type:"concept" },
      { no: 446, word: "藩校", desc: "江戸時代諸藩が設けた教育施設。藩士の子弟に、おもに儒学や武芸を教えた。全国で300近く設けられた。", type:"concept" },
      { no: 447, word: "寺子屋", desc: "江戸時代、庶民のための教育施設。僧・神官や裕福な町人が開き、「読み・書き・そろばん」など日常生活に役立つことや道徳を教えた。", type:"concept" },
    ],
  },
  {
    id: "ousei", label: "欧米の近代化", icon: "🏛️", color: "#2c3e50",
    cards: [
      { no: 448, word: "絶対王政", desc: "16〜18世紀のヨーロッパで、国王が強い権力をもっておこなった専制的な政治。イギリスのエリザベス1世、フランスのルイ14世などが代表的。", type:"concept" },
      { no: 449, word: "ピューリタン革命（清教徒革命）", desc: "1640年、イギリスではじまった市民革命。クロムウェルの指導する議会派は国王を処刑して共和制に移行した。", type:"event" },
      { no: 450, word: "クロムウェル", desc: "ピューリタン革命の指導者。議会派を率いて国王を処刑し、共和制をはじめた。しかし厳しい政治は人々の不満をまねき、彼の死後ふたたび王政に戻った。", type:"person" },
      { no: 451, word: "名誉革命", desc: "1688年にイギリスでおこった市民革命。議会が国王を追放し、翌年、議会は権利の章典を定めて議会政治の基礎を確立した。", type:"event" },
      { no: 452, word: "権利の章典", desc: "1689年、政治の中心が議会にあることを承認した法律。名誉革命後に「議会の承認なしには王権の行使はできない」などの内容で制定された。", type:"work" },
      { no: 453, word: "立憲君主制", desc: "君主の権力が憲法により制限されている政治。17世紀のイギリスで市民革命をもとに基礎が確立された。「王は君臨すれども統治せず」という原則が確立した。", type:"concept" },
      { no: 454, word: "ロック", desc: "イギリスの思想家。「社会契約説」と抵抗権（革命権）を説き、アメリカ独立宣言・フランス革命に大きな影響を与えた。", type:"person" },
      { no: 455, word: "モンテスキュー", desc: "フランスの思想家。「法の精神」をあらわして、立法・行政・司法の三権分立を説き、アメリカ合衆国憲法などに影響を与えた。", type:"person" },
      { no: 456, word: "ルソー", desc: "フランスの思想家。社会の不平等をなくすため自然への回帰を説き、さらに「社会契約論」をあらわして人民主権を説いた。", type:"person" },
      { no: 457, word: "産業革命", desc: "18世紀後半にイギリスから始まった、産業や社会のしくみの大きな変化。工場制手工業から工場制機械工業へとかわり、資本主義のしくみができあがった。", type:"event" },
      { no: 458, word: "ワット", desc: "蒸気機関を動力として利用するよう改良したイギリスの技術者。蒸気機関が工場や交通機関で使われるようになり、産業革命をいっそう推し進めることになった。", type:"person" },
      { no: 459, word: "資本主義", desc: "資本家が利潤を得ることを目的に労働者を雇って商品を生産する経済のしくみ。産業革命によって確立し、私有財産制度と自由競争を基本としている。", type:"concept" },
      { no: 460, word: "労働組合", desc: "労働条件の改善などを求めて労働者が自主的に結成する団体。産業革命の進展とともに各国で結成されるようになった。", type:"concept" },
      { no: 461, word: "社会主義", desc: "土地や工場など生産手段を社会全体のものとして、階級のない平等な社会をつくろうとする考え方。資本主義に対する考えとして生まれた。", type:"concept" },
      { no: 462, word: "マルクス", desc: "ドイツの経済学者・哲学者。エンゲルスとともに「共産党宣言」をあらわして、労働者が団結して新しい社会主義の社会を実現しようと訴えた。", type:"person" },
      { no: 463, word: "独立宣言", desc: "1776年7月4日、アメリカ独立戦争中に出された宣言。人間は生まれながらに平等であることや圧政に対する抵抗権などを内容とし、フランス革命の「人権宣言」などに影響を与えた。", type:"work" },
      { no: 464, word: "ワシントン", desc: "アメリカ初代大統領。独立戦争では総司令官に選ばれてアメリカを勝利に導き、アメリカ合衆国憲法制定にともなって初代大統領になった。", type:"person" },
      { no: 465, word: "リンカーン", desc: "南北戦争当時のアメリカ大統領。奴隷解放宣言などをおこなって北軍を勝利に導いた。「人民の、人民による、人民のための政治」の演説で有名。", type:"person" },
      { no: 466, word: "南北戦争", desc: "アメリカ南北両地域間でおこなわれた戦争。貿易や自治、奴隷制などをめぐって対立し、南部諸州が別の国をつくったことから始まった。奴隷解放宣言で内外の支持をあつめた北軍が勝利した。", type:"event" },
      { no: 467, word: "フランス革命", desc: "1789年、フランスのパリで起きた市民革命。市民がバスチーユ牢獄を襲撃してはじまった。国民議会は封建的特権を廃止し、人権宣言を発表した。", type:"event" },
      { no: 468, word: "フランス人権宣言", desc: "1789年、フランス革命で発表された宣言。自由・平等、人民主権、思想・言論の自由、私有財産の不可侵などを内容とし、近代市民社会の原理を示した。", type:"work" },
      { no: 469, word: "ナポレオン", desc: "フランスの皇帝・軍人。革命政府のもとで名声を高め、1799年に政権をにぎった。1804年には皇帝になった。ロシアへの遠征に敗れ、セントヘレナ島に流された。", type:"person" },
    ],
  },
  {
    id: "asia", label: "アジアの動揺", icon: "🌏", color: "#27ae60",
    cards: [
      { no: 470, word: "イギリス東インド会社", desc: "1600年に設立された貿易会社。香辛料の輸入などアジア貿易の独占権を与えられ、外交権・軍事権なども持つ国家的な機関で、イギリスのアジア植民地支配に大きな役割を果たした。", type:"place" },
      { no: 471, word: "アヘン戦争", desc: "アヘンの密輸をめぐる清とイギリスの戦争。イギリスは支払いの銀を得るためインド産のアヘンを中国に密輸した。清がアヘンを厳しく取り締まると、イギリスは武力で清を降伏させた。", type:"event" },

      { no: 497, word: "木戸孝允", desc: "長州藩士・明治初期の政治家。桂小五郎と称して倒幕運動に参加し、薩長同盟を進めて幕府を倒した。新政府の中心となり、廃藩置県を断行した。", type:"person" },
      { no: 498, word: "坂本龍馬", desc: "土佐藩士。勝海舟に航海術を学び、長崎に海援隊をつくって貿易と海運をおこなった。また、薩長同盟の仲立ちをし、大政奉還の実現に努力した。", type:"person" },

      { no: 501, word: "大政奉還", desc: "1867年、15代将軍徳川慶喜が朝廷に政権を返したこと。徳川慶喜は天皇のもとでの新しい政権でも実権をもち続けようとかんがえて政権を返上した。", type:"event" },

const shuffle = (arr) => {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};

function AnkiApp() {
  const [screen, setScreen] = useState("home");
  const [unit, setUnit] = useState(null);
  const [mode, setMode] = useState("flashcard");
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [quizChoices, setQuizChoices] = useState([]);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState({ ok: 0, ng: 0 });
  const [particles, setParticles] = useState([]);
  const [finished, setFinished] = useState(false);
  const timerRef = useRef(null);

  const spawnParticles = (ok) => {
    setParticles(Array.from({ length: 8 }, (_, i) => ({
      id: Date.now() + i,
      x: 20 + Math.random() * 60,
      y: 30 + Math.random() * 40,
      emoji: ok ? ["⭐","✨","🎉","💫"][i%4] : ["💨","😅"][i%2]
    })));
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setParticles([]), 1100);
  };

  const buildChoices = (cards, currentIdx) => {
    const correct = cards[currentIdx];
    const allCards = UNITS.flatMap(u => u.cards);
    // 同じtypeから候補を選ぶ、足りなければ全体から補充
    const sameType = allCards.filter(c => c.word !== correct.word && c.type === correct.type);
    const otherType = allCards.filter(c => c.word !== correct.word && c.type !== correct.type);
    const pool = shuffle(sameType).concat(shuffle(otherType));
    const others = pool.slice(0, 3);
    return shuffle([correct, ...others]);
  };

  const startStudy = (u, m) => {
    const shuffled = shuffle(u.cards);
    setUnit(u); setMode(m); setDeck(shuffled); setIdx(0);
    setFlipped(false); setSelected(null); setScore({ ok: 0, ng: 0 }); setFinished(false);
    if (m === "quiz") setQuizChoices(buildChoices(shuffled, 0));
    setScreen("study");
  };

  const goNext = () => {
    const nextIdx = idx + 1;
    if (nextIdx >= deck.length) { setFinished(true); return; }
    setIdx(nextIdx); setFlipped(false); setSelected(null);
    if (mode === "quiz") setQuizChoices(buildChoices(deck, nextIdx));
  };

  const handleKnew = () => { setScore(s => ({ ...s, ok: s.ok + 1 })); spawnParticles(true); goNext(); };
  const handleDidnt = () => { setScore(s => ({ ...s, ng: s.ng + 1 })); spawnParticles(false); goNext(); };
  const handleChoice = (c) => {
    if (selected) return;
    setSelected(c);
    const ok = c.word === deck[idx].word;
    setScore(s => ({ ok: s.ok + (ok ? 1 : 0), ng: s.ng + (ok ? 0 : 1) }));
    spawnParticles(ok);
  };

  const unitColor = unit ? unit.color : "#6478ff";
  const totalCards = deck.length;
  const progress = totalCards ? (idx / totalCards) * 100 : 0;

  const S = {
    wrap: { minHeight:"100vh", background:"linear-gradient(135deg,#08080f,#0e101e 60%,#060c14)", fontFamily:"'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif", color:"#e8e8f0", position:"relative", overflow:"hidden" },
    grid: { position:"fixed", inset:0, pointerEvents:"none", backgroundImage:"linear-gradient(rgba(100,120,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(100,120,255,0.035) 1px,transparent 1px)", backgroundSize:"40px 40px" },
    inner: { maxWidth:640, margin:"0 auto", padding:"16px 14px" },
  };

  return (
    <div style={S.wrap}>
      <div style={S.grid} />
      <style>{`
        @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-65px) scale(1.4)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes flipIn{from{opacity:0;transform:rotateX(-15deg) translateY(8px)}to{opacity:1;transform:rotateX(0) translateY(0)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(100,120,255,0.3)}50%{box-shadow:0 0 0 10px rgba(100,120,255,0)}}
        .ch:hover{transform:translateY(-2px) scale(1.013);filter:brightness(1.1)}.ch{transition:transform 0.16s,filter 0.16s;cursor:pointer}
        .cb:hover{filter:brightness(1.12);transform:translateX(3px)}.cb{transition:all 0.12s;cursor:pointer}
        .fbtn:hover{filter:brightness(1.15)}.fbtn{transition:filter 0.15s;cursor:pointer}
      `}</style>

      {particles.map(p => (
        <div key={p.id} style={{ position:"fixed", left:`${p.x}%`, top:`${p.y}%`, fontSize:"1.8rem", pointerEvents:"none", zIndex:999, animation:"floatUp 1.1s ease-out forwards" }}>{p.emoji}</div>
      ))}

      <div style={S.inner}>
        <div style={{ textAlign:"center", marginBottom:18 }}>
          <div style={{ fontSize:"0.68rem", letterSpacing:"0.24em", color:"#6478ff", textTransform:"uppercase", marginBottom:4 }}>HISTORY FLASH CARDS</div>
          <h1 style={{ fontSize:"1.55rem", fontWeight:900, margin:0, background:"linear-gradient(90deg,#8fa8ff,#c8a8ff,#8fc8ff)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>江戸〜幕末 語句暗記</h1>
          <div style={{ fontSize:"0.74rem", color:"#556", marginTop:4 }}>教科書 No.402〜506 · 全105語句</div>
          {screen === "study" && !finished && (
            <div style={{ marginTop:8, display:"flex", justifyContent:"center", gap:8, flexWrap:"wrap" }}>
              <span style={{ background:"rgba(100,120,255,0.15)", border:"1px solid rgba(100,120,255,0.3)", borderRadius:20, padding:"2px 12px", fontSize:"0.76rem" }}>{idx+1}/{totalCards}</span>
              <span style={{ background:"rgba(39,174,96,0.15)", border:"1px solid #27ae6055", borderRadius:20, padding:"2px 12px", fontSize:"0.76rem", color:"#7ef0a8" }}>✅{score.ok}</span>
              <span style={{ background:"rgba(192,57,43,0.15)", border:"1px solid #c0392b55", borderRadius:20, padding:"2px 12px", fontSize:"0.76rem", color:"#f08080" }}>❌{score.ng}</span>
            </div>
          )}
        </div>

        {/* HOME */}
        {screen === "home" && (
          <div>
            <div style={{ display:"flex", gap:8, marginBottom:16, background:"rgba(100,120,255,0.07)", border:"1px solid rgba(100,120,255,0.15)", borderRadius:12, padding:"10px 14px", fontSize:"0.78rem", color:"#8899bb", lineHeight:1.6, flexWrap:"wrap" }}>
              <span>📖 <b style={{color:"#aab"}}>フラッシュカード</b> — 語句を見て説明を確認</span>
              <span style={{margin:"0 6px",color:"#334"}}>|</span>
              <span>🧠 <b style={{color:"#aab"}}>クイズ</b> — 説明を見て語句を4択で答える</span>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
              {UNITS.map(u => (
                <div key={u.id} style={{ background:"linear-gradient(135deg,rgba(16,16,32,0.95),rgba(22,22,44,0.9))", border:`1px solid ${u.color}33`, borderLeft:`4px solid ${u.color}`, borderRadius:13, padding:"13px 16px" }}>
                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                    <span style={{ fontSize:"1.4rem" }}>{u.icon}</span>
                    <div>
                      <div style={{ fontWeight:700, fontSize:"0.96rem" }}>{u.label}</div>
                      <div style={{ fontSize:"0.7rem", color:"#556", marginTop:1 }}>全{u.cards.length}語句</div>
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:8 }}>
                    <button className="fbtn" onClick={() => startStudy(u, "flashcard")} style={{ flex:1, padding:"8px 0", borderRadius:9, background:`${u.color}22`, border:`1px solid ${u.color}44`, color:"#ccd", fontSize:"0.8rem", fontWeight:600 }}>📖 フラッシュカード</button>
                    <button className="fbtn" onClick={() => startStudy(u, "quiz")} style={{ flex:1, padding:"8px 0", borderRadius:9, background:`${u.color}33`, border:`1px solid ${u.color}66`, color:"#dde", fontSize:"0.8rem", fontWeight:600 }}>🧠 クイズ</button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* STUDY */}
        {screen === "study" && !finished && deck.length > 0 && (
          <div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:12 }}>
              <span style={{ fontSize:"0.95rem" }}>{unit.icon}</span>
              <span style={{ fontSize:"0.77rem", color:unitColor, fontWeight:600 }}>{unit.label}</span>
              <span style={{ fontSize:"0.72rem", color:"#556", marginLeft:4 }}>{mode === "flashcard" ? "📖 カード" : "🧠 クイズ"}</span>
              <button onClick={() => setScreen("home")} style={{ marginLeft:"auto", background:"rgba(100,120,255,0.1)", border:"1px solid #334", borderRadius:8, color:"#778", padding:"4px 10px", fontSize:"0.73rem", cursor:"pointer" }}>← 戻る</button>
            </div>
            <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
              <div style={{ flex:1, height:4, background:"#1a1a35", borderRadius:4, overflow:"hidden" }}>
                <div style={{ height:"100%", width:`${progress}%`, background:`linear-gradient(90deg,${unitColor},${unitColor}88)`, transition:"width 0.4s", borderRadius:4 }} />
              </div>
            </div>
            <div style={{ fontSize:"0.7rem", color:"#445", marginBottom:6, textAlign:"right" }}>No.{deck[idx].no}</div>

            {mode === "flashcard" && (
              <div>
                <div style={{ background:`linear-gradient(135deg,${unitColor}18,${unitColor}08)`, border:`1px solid ${unitColor}44`, borderRadius:18, padding:"28px 22px", textAlign:"center", marginBottom:14, minHeight:110, display:"flex", alignItems:"center", justifyContent:"center" }}>
                  <div style={{ fontSize:"2rem", fontWeight:900, letterSpacing:"0.04em", color:"#f0f0ff" }}>{deck[idx].word}</div>
                </div>
                {!flipped ? (
                  <button className="fbtn" onClick={() => setFlipped(true)} style={{ width:"100%", padding:"14px", borderRadius:14, background:"rgba(100,120,255,0.1)", border:"2px dashed rgba(100,120,255,0.3)", color:"#8899cc", fontWeight:600, fontSize:"0.9rem", cursor:"pointer", marginBottom:14 }}>
                    タップして説明を見る 👁️
                  </button>
                ) : (
                  <div style={{ background:"rgba(14,16,30,0.95)", border:`1px solid ${unitColor}33`, borderRadius:14, padding:"18px", marginBottom:14, animation:"flipIn 0.3s ease" }}>
                    <p style={{ margin:0, fontSize:"0.88rem", lineHeight:1.8, color:"#c8cce0" }}>{deck[idx].desc}</p>
                  </div>
                )}
                {flipped && (
                  <div style={{ display:"flex", gap:10 }}>
                    <button className="fbtn" onClick={handleDidnt} style={{ flex:1, padding:"13px", borderRadius:12, background:"rgba(192,57,43,0.18)", border:"1px solid #c0392b66", color:"#f08080", fontWeight:700, fontSize:"0.9rem", cursor:"pointer" }}>😅 あやふや</button>
                    <button className="fbtn" onClick={handleKnew} style={{ flex:1, padding:"13px", borderRadius:12, background:"rgba(39,174,96,0.18)", border:"1px solid #27ae6066", color:"#7ef0a8", fontWeight:700, fontSize:"0.9rem", cursor:"pointer" }}>✅ 覚えた！</button>
                  </div>
                )}
              </div>
            )}

            {mode === "quiz" && (
              <div>
                <div style={{ background:"linear-gradient(135deg,rgba(18,20,44,0.97),rgba(22,25,52,0.9))", border:`1px solid ${unitColor}33`, borderRadius:16, padding:"20px 18px", marginBottom:14 }}>
                  <div style={{ fontSize:"0.68rem", color:"#445", marginBottom:6 }}>次の説明にあてはまる語句はどれ？</div>
                  <p style={{ margin:0, fontSize:"0.9rem", lineHeight:1.8, color:"#c8cce0" }}>{deck[idx].desc}</p>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:8, marginBottom:14 }}>
                  {quizChoices.map((c, i) => {
                    const isSel = selected && selected.word === c.word;
                    const isAns = !!selected;
                    const isRight = c.word === deck[idx].word;
                    let bg = "rgba(18,20,44,0.85)", border = "1px solid #252545", color = "#ccd";
                    if (isAns) {
                      if (isRight) { bg = "rgba(39,174,96,0.18)"; border = "1px solid #27ae6077"; color = "#7ef0a8"; }
                      else if (isSel) { bg = "rgba(192,57,43,0.18)"; border = "1px solid #c0392b77"; color = "#f08080"; }
                    }
                    return (
                      <div key={i} className={isAns ? "" : "cb"} onClick={() => handleChoice(c)}
                        style={{ background:bg, border, borderRadius:11, padding:"12px 14px", color, display:"flex", alignItems:"center", gap:10, fontSize:"0.92rem", opacity: isAns && !isRight && !isSel ? 0.38 : 1 }}>
                        <span style={{ width:26, height:26, borderRadius:7, flexShrink:0, background: isAns ? (isRight ? "#27ae60" : isSel ? "#c0392b" : "#1a1a35") : "#1a1a35", border: isAns ? "none" : "1px solid #334", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"0.76rem", fontWeight:700, color: isAns ? "#fff" : "#556" }}>
                          {isAns ? (isRight ? "○" : isSel ? "✕" : "") : ["A","B","C","D"][i]}
                        </span>
                        {c.word}
                      </div>
                    );
                  })}
                </div>
                {selected && (
                  <button className="fbtn" onClick={goNext} style={{ width:"100%", padding:"13px", borderRadius:12, background:`linear-gradient(135deg,${unitColor},${unitColor}bb)`, border:"none", color:"#fff", fontWeight:700, fontSize:"0.95rem", cursor:"pointer", animation:"pulse 2s infinite" }}>
                    {idx + 1 >= totalCards ? "結果を見る 🏆" : "次へ →"}
                  </button>
                )}
              </div>
            )}
          </div>
        )}

        {/* FINISHED */}
        {screen === "study" && finished && (
          <div style={{ textAlign:"center", paddingTop:20 }}>
            <div style={{ fontSize:"3.5rem", marginBottom:10 }}>{score.ok / totalCards >= 0.8 ? "🏆" : score.ok / totalCards >= 0.5 ? "👍" : "📚"}</div>
            <h2 style={{ fontSize:"1.3rem", fontWeight:900, marginBottom:5, color:unitColor }}>{unit.label} 完了！</h2>
            {mode === "quiz" ? (
              <div>
                <p style={{ fontSize:"1.9rem", fontWeight:900, marginBottom:4 }}>{score.ok} <span style={{ fontSize:"0.95rem", color:"#778" }}>/ {totalCards} 問正解</span></p>
                <p style={{ color:"#aab", fontSize:"0.85rem", marginBottom:22 }}>正解率 {Math.round((score.ok / totalCards) * 100)}%　{score.ok / totalCards >= 0.8 ? "すばらしい！🎉" : score.ok / totalCards >= 0.5 ? "なかなか👍" : "もう一度復習しよう📖"}</p>
              </div>
            ) : (
              <div>
                <p style={{ fontSize:"1.4rem", fontWeight:700, marginBottom:4 }}>✅ {score.ok}語 / ❌ {score.ng}語</p>
                <p style={{ color:"#aab", fontSize:"0.85rem", marginBottom:22 }}>全{totalCards}語句を確認しました！</p>
              </div>
            )}
            <div style={{ display:"flex", gap:9, justifyContent:"center", flexWrap:"wrap" }}>
              <button className="fbtn" onClick={() => startStudy(unit, mode)} style={{ padding:"11px 18px", borderRadius:11, background:`linear-gradient(135deg,${unitColor},${unitColor}99)`, border:"none", color:"#fff", fontWeight:700, fontSize:"0.88rem", cursor:"pointer" }}>もう一度</button>
              <button className="fbtn" onClick={() => startStudy(unit, mode === "flashcard" ? "quiz" : "flashcard")} style={{ padding:"11px 18px", borderRadius:11, background:"rgba(100,120,255,0.18)", border:"1px solid rgba(100,120,255,0.35)", color:"#aab", fontWeight:700, fontSize:"0.88rem", cursor:"pointer" }}>{mode === "flashcard" ? "🧠 クイズに挑戦" : "📖 カードで復習"}</button>
              <button className="fbtn" onClick={() => setScreen("home")} style={{ padding:"11px 18px", borderRadius:11, background:"rgba(50,50,70,0.5)", border:"1px solid #334", color:"#778", fontWeight:700, fontSize:"0.88rem", cursor:"pointer" }}>← 単元選択</button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AnkiApp />);
</script>
</body>
</html>
