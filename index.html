<div id="root"></div>

      { q: "寛政の改革を行った老中は誰か？", choices: ["松平定信","水野忠邦","田沼意次","徳川吉宗"], a: "松平定信", exp: "松平定信が寛政の改革を行い、農村復興・出稼ぎ制限・昌平坂学問所の設置などを実施した。" },

    ]
  },
  {
    id: "bunka", label: "江戸の文化", icon: "🎭", color: "#8e44ad",
    questions: [
      { q: "「奥の細道」を書いた人物は誰か？", choices: ["松尾芭蕉","近松門左衛門","井原西鶴","本居宣長"], a: "松尾芭蕉", exp: "松尾芭蕉が「奥の細道」を書いた。江戸から東北・北陸をへて大垣に至る旅の俳諧紀行文。" },
      { q: "「曽根崎心中」を書いた人物は誰か？", choices: ["近松門左衛門","松尾芭蕉","井原西鶴","滝沢馬琴"], a: "近松門左衛門", exp: "近松門左衛門は人形浄瑠璃・歌舞伎の台本作家で「曽根崎心中」が代表作。" },
      { q: "「富嶽三十六景」を描いた人物は誰か？", choices: ["葛飾北斎","歌川広重","菱川師宣","喜多川歌麿"], a: "葛飾北斎", exp: "葛飾北斎は化政文化を代表する浮世絵師で「富嶽三十六景」が代表作。" },
      { q: "「東海道五十三次」を描いた人物は誰か？", choices: ["歌川広重","葛飾北斎","菱川師宣","尾形光琳"], a: "歌川広重", exp: "歌川（安藤）広重は化政文化を代表する浮世絵師で「東海道五十三次」が代表作。" },
      { q: "元禄文化が栄えた都市はどこか？", choices: ["京都・大阪（上方）","江戸","長崎","名古屋"], a: "京都・大阪（上方）", exp: "元禄文化は17世紀末〜18世紀はじめ、主に上方（京都・大阪）を中心に栄えた町人文化。" },
      { q: "化政文化が栄えた都市はどこか？", choices: ["江戸","京都・大阪（上方）","長崎","大阪"], a: "江戸", exp: "化政文化は19世紀はじめ、11代将軍・徳川家斉の時代に江戸を中心に栄えた町人文化。" },
      { q: "「古事記伝」を著して国学を大成した人物は？", choices: ["本居宣長","杉田玄白","平賀源内","伊能忠敬"], a: "本居宣長", exp: "本居宣長が「古事記伝」を完成させて国学を大成した。日本古来の思想を研究した学問。" },
      { q: "「解体新書」を翻訳・出版した人物は？", choices: ["杉田玄白","本居宣長","平賀源内","伊能忠敬"], a: "杉田玄白", exp: "杉田玄白が前野良沢らとオランダ語の人体解剖書を翻訳し「解体新書」として出版した。" },
      { q: "浮世絵を大成した江戸前期の絵師は誰か？", choices: ["菱川師宣","葛飾北斎","歌川広重","喜多川歌麿"], a: "菱川師宣", exp: "菱川師宣が元禄時代に浮世絵を大成した。代表作は「見返り美人図」。" },
      { q: "「東海道中膝栗毛」を書いた作家は誰か？", choices: ["十返舎一九","滝沢馬琴","井原西鶴","近松門左衛門"], a: "十返舎一九", exp: "十返舎一九は化政文化の作家で、滑稽本「東海道中膝栗毛」が代表作。" },
    ]
  },
  {
    id: "sekai", label: "世界の歴史と幕末", icon: "🌍", color: "#2471a3",
    questions: [
      { q: "「法の精神」で三権分立を説いた思想家は誰か？", choices: ["モンテスキュー","ロック","ルソー","ワット"], a: "モンテスキュー", exp: "モンテスキューはフランスの思想家で「法の精神」をあらわして立法・行政・司法の三権分立を説いた。" },
      { q: "「社会契約論」で人民主権を説いた思想家は誰か？", choices: ["ルソー","ロック","モンテスキュー","マルクス"], a: "ルソー", exp: "ルソーはフランスの思想家で「社会契約論」をあらわして人民主権を説いた。" },
      { q: "抵抗権（革命権）を説いてアメリカ独立宣言に影響を与えた思想家は誰か？", choices: ["ロック","ルソー","モンテスキュー","ワシントン"], a: "ロック", exp: "ロックはイギリスの思想家で社会契約説と抵抗権を説き、アメリカ独立宣言・フランス革命に影響を与えた。" },
      { q: "アメリカ独立戦争を勝利に導き、初代大統領になった人物は誰か？", choices: ["ワシントン","リンカーン","ナポレオン","クロムウェル"], a: "ワシントン", exp: "ワシントンは独立戦争の総司令官として勝利に導き、アメリカ合衆国の初代大統領になった。" },
      { q: "奴隷解放宣言を行い「人民の、人民による、人民のための政治」で有名な大統領は？", choices: ["リンカーン","ワシントン","ナポレオン","クロムウェル"], a: "リンカーン", exp: "リンカーンは南北戦争中の大統領で奴隷解放宣言を行い、ゲティスバーグの演説でも有名。" },
      { q: "アヘン戦争の結果、清とイギリスの間で結ばれた条約は何か？", choices: ["南京条約","ポーツマス条約","下関条約","日米和親条約"], a: "南京条約", exp: "1842年に南京条約が結ばれ、清はイギリスに香港を譲り渡し、上海など5港の開港を認めた。" },
      { q: "日米修好通商条約の問題点として正しいのはどれか？", choices: ["関税自主権がなく領事裁判権を認めた","関税自主権があり平等な条約だった","鎖国を維持できる条約だった","朝鮮との貿易のみ認めた条約だった"], a: "関税自主権がなく領事裁判権を認めた", exp: "日米修好通商条約は関税自主権がなく領事裁判権を認めた不平等条約。大老・井伊直弼が朝廷の許可なしに結んだ。" },
      { q: "安政の大獄の後、井伊直弼が暗殺された事件は何か？", choices: ["桜田門外の変","生麦事件","大塩平八郎の乱","蛮社の獄"], a: "桜田門外の変", exp: "1860年、水戸藩の浪士らが江戸城桜田門外で大老・井伊直弼を暗殺した事件。" },
      { q: "インド大反乱のきっかけとなったのは何か？", choices: ["東インド会社のインド人兵士の反乱","アヘン戦争での清の敗北","フランス革命の影響","ムガル帝国の侵攻"], a: "東インド会社のインド人兵士の反乱", exp: "東インド会社にやとわれていたインド人兵士の反乱に王侯や農民が加わり全土に広がった。" },
      { q: "イギリスがインドにアヘンを輸出していた三角貿易の流れとして正しいのはどれか？", choices: ["イギリス→インド（綿製品）→清（アヘン）→イギリス（銀）","イギリス→清（綿製品）→インド（アヘン）→イギリス（銀）","インド→イギリス（綿製品）→清（アヘン）→インド（銀）","清→インド（アヘン）→イギリス（銀）→清（綿製品）"], a: "イギリス→インド（綿製品）→清（アヘン）→イギリス（銀）", exp: "イギリスは清に綿製品を輸出できなかったためインドにアヘンを密輸し、清から銀・茶・絹を得る三角貿易を行った。" },
    ]
  },
  {
    id: "bakumatsu", label: "幕末の動乱", icon: "⚔️", color: "#117864",
    questions: [
      { q: "1853年、浦賀に来航して開国を求めたアメリカの提督は誰か？", choices: ["ペリー","ラクスマン","レザノフ","リンカーン"], a: "ペリー", exp: "ペリーは1853年に軍艦4隻で浦賀に来航し、翌1854年に日米和親条約を結んで日本を開国させた。" },
      { q: "1854年に結ばれた日本とアメリカの条約は何か？", choices: ["日米和親条約","日米修好通商条約","南京条約","ポーツマス条約"], a: "日米和親条約", exp: "日米和親条約は1854年に結ばれ、下田・函館を開港し、入港する船に燃料・食料を供給することを認めた。" },
      { q: "薩長同盟の仲立ちをし、大政奉還の実現に尽力した土佐藩士は誰か？", choices: ["坂本龍馬","西郷隆盛","木戸孝允","大久保利通"], a: "坂本龍馬", exp: "坂本龍馬は土佐藩士で薩長同盟の仲立ちをし、大政奉還の実現に努力した。" },
      { q: "1867年、15代将軍が朝廷に政権を返したことを何というか？", choices: ["大政奉還","王政復古の大号令","廃藩置県","戊辰戦争"], a: "大政奉還", exp: "1867年、15代将軍・徳川慶喜が朝廷に政権を返したことを大政奉還という。" },
      { q: "朝廷の権威を高め外国を追い払おうとした幕末の政治運動は何か？", choices: ["尊王攘夷論","自由民権運動","大政奉還","王政復古"], a: "尊王攘夷論", exp: "尊王攘夷論は朝廷の権威を高め外国の勢力を打ち払うことをかかげた幕末の政治運動。" },
      { q: "吉田松陰が開いた私塾で、高杉晋作など多くの人材を育てた場所はどこか？", choices: ["松下村塾","昌平坂学問所","適塾","鳴滝塾"], a: "松下村塾", exp: "吉田松陰が萩（山口県）に開いた松下村塾では高杉晋作・伊藤博文など多くの人材が育った。" },
    ]
  },
];

const shuffle = arr => {
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
};

function App() {
  const [screen, setScreen] = useState("home"); // home | section | quiz | result
  const [activeSection, setActiveSection] = useState(null);
  const [deck, setDeck] = useState([]);
  const [idx, setIdx] = useState(0);
  const [selected, setSelected] = useState(null);
  const [score, setScore] = useState({ ok:0, ng:0 });
  const [showExp, setShowExp] = useState(false);
  const [particles, setParticles] = useState([]);
  const [wrongList, setWrongList] = useState([]);
  const timerRef = useRef(null);

  const spawnParticles = ok => {
    setParticles(Array.from({length:8},(_,i)=>({id:Date.now()+i,x:20+Math.random()*60,y:30+Math.random()*40,emoji:ok?["⭐","✨","🎉","💫"][i%4]:["💨","😅"][i%2]})));
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(()=>setParticles([]),1100);
  };

  const startQuiz = (section, mode) => {
    let qs = mode === "wrong" ? wrongList : shuffle([...section.questions]);
    setActiveSection(section);
    setDeck(qs.map(q=>({...q, _choices:shuffle([...q.choices])}))); 
    setIdx(0); setSelected(null); setScore({ok:0,ng:0}); setShowExp(false);
    if(mode!=="wrong") setWrongList([]);
    setScreen("quiz");
  };

  const handleChoice = ch => {
    if(selected!==null) return;
    setSelected(ch);
    const ok = ch === deck[idx].a;
    setScore(s=>({ok:s.ok+(ok?1:0),ng:s.ng+(ok?0:1)}));
    if(!ok) setWrongList(w=>[...w, deck[idx]]);
    spawnParticles(ok);
    setShowExp(false);
  };

  const goNext = () => {
    if(idx+1 >= deck.length){ setScreen("result"); return; }
    setIdx(i=>i+1); setSelected(null); setShowExp(false);
  };

  const color = activeSection?.color ?? "#6478ff";
  const total = deck.length;

  return (
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#07070e,#0d0f1c 60%,#060c14)",fontFamily:"'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif",color:"#e8e8f0",overflow:"hidden",position:"relative"}}>
      <div style={{position:"fixed",inset:0,pointerEvents:"none",backgroundImage:"linear-gradient(rgba(100,120,255,0.035) 1px,transparent 1px),linear-gradient(90deg,rgba(100,120,255,0.035) 1px,transparent 1px)",backgroundSize:"40px 40px"}} />
      {particles.map(p=><div key={p.id} style={{position:"fixed",left:`${p.x}%`,top:`${p.y}%`,fontSize:"1.8rem",pointerEvents:"none",zIndex:999,animation:"floatUp 1.1s ease-out forwards"}}>{p.emoji}</div>)}
      <style>{`
        @keyframes floatUp{0%{opacity:1;transform:translateY(0)scale(1)}100%{opacity:0;transform:translateY(-65px)scale(1.4)}}
        @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(100,120,255,.3)}50%{box-shadow:0 0 0 10px rgba(100,120,255,0)}}
        .ch:hover{transform:translateY(-2px)scale(1.013);filter:brightness(1.1)}.ch{transition:transform .16s,filter .16s;cursor:pointer}
        .cb:hover{filter:brightness(1.12);transform:translateX(3px)}.cb{transition:all .12s;cursor:pointer}
        .fb:hover{filter:brightness(1.15)}.fb{transition:filter .14s;cursor:pointer}
      `}</style>

      <div style={{maxWidth:640,margin:"0 auto",padding:"16px 14px"}}>

        {/* ヘッダー */}
        <div style={{textAlign:"center",marginBottom:18}}>
          <div style={{fontSize:"0.68rem",letterSpacing:"0.24em",color:"#e67e22",textTransform:"uppercase",marginBottom:4}}>EXAM PREP</div>
          <h1 style={{fontSize:"1.5rem",fontWeight:900,margin:0,background:"linear-gradient(90deg,#f0a060,#f0d080,#f0a060)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>中間考査 予想問題</h1>
          <div style={{fontSize:"0.72rem",color:"#556",marginTop:4}}>6/7 社会 · 全{SECTIONS.reduce((s,sec)=>s+sec.questions.length,0)}問</div>
          {screen==="quiz" && (
            <div style={{marginTop:8,display:"flex",justifyContent:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{background:"rgba(100,120,255,0.15)",border:"1px solid rgba(100,120,255,.3)",borderRadius:20,padding:"2px 12px",fontSize:"0.76rem"}}>{idx+1}/{total}</span>
              <span style={{background:"rgba(39,174,96,0.15)",border:"1px solid #27ae6055",borderRadius:20,padding:"2px 12px",fontSize:"0.76rem",color:"#7ef0a8"}}>✅{score.ok}</span>
              <span style={{background:"rgba(192,57,43,0.15)",border:"1px solid #c0392b55",borderRadius:20,padding:"2px 12px",fontSize:"0.76rem",color:"#f08080"}}>❌{score.ng}</span>
            </div>
          )}
        </div>

        {/* HOME */}
        {screen==="home" && (
          <div style={{animation:"fadeIn 0.45s ease"}}>
            <p style={{textAlign:"center",color:"#778",fontSize:"0.85rem",marginBottom:20}}>分野を選んでスタート！</p>
            <div style={{display:"flex",flexDirection:"column",gap:11}}>
              {SECTIONS.map(sec=>(
                <div key={sec.id} className="ch" onClick={()=>{setActiveSection(sec);setScreen("section");}}
                  style={{background:"linear-gradient(135deg,rgba(16,16,32,.95),rgba(22,22,44,.9))",border:`1px solid ${sec.color}44`,borderLeft:`4px solid ${sec.color}`,borderRadius:13,padding:"15px 18px",display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:"1.8rem"}}>{sec.icon}</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:"1rem"}}>{sec.label}</div>
                    <div style={{fontSize:"0.72rem",color:"#556",marginTop:2}}>全{sec.questions.length}問</div>
                  </div>
                  <div style={{marginLeft:"auto",color:sec.color,fontSize:"1.2rem"}}>▶</div>
                </div>
              ))}
              {/* 全問チャレンジ */}
              <div className="ch" onClick={()=>startQuiz({...SECTIONS[0], questions: shuffle(SECTIONS.flatMap(s=>s.questions)), label:"全分野ミックス", icon:"🎯", color:"#e67e22"}, "all")}
                style={{background:"linear-gradient(135deg,rgba(230,126,34,.15),rgba(230,126,34,.05))",border:"1px solid #e67e2244",borderLeft:"4px solid #e67e22",borderRadius:13,padding:"15px 18px",display:"flex",alignItems:"center",gap:14}}>
                <span style={{fontSize:"1.8rem"}}>🎯</span>
                <div>
                  <div style={{fontWeight:700,fontSize:"1rem"}}>全分野ミックス</div>
                  <div style={{fontSize:"0.72rem",color:"#778",marginTop:2}}>全{SECTIONS.reduce((s,sec)=>s+sec.questions.length,0)}問 シャッフル出題</div>
                </div>
                <div style={{marginLeft:"auto",color:"#e67e22",fontSize:"1.2rem"}}>▶</div>
              </div>
            </div>
          </div>
        )}

        {/* SECTION */}
        {screen==="section" && activeSection && (
          <div style={{animation:"fadeIn 0.4s ease"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:18}}>
              <button className="fb" onClick={()=>setScreen("home")} style={{background:"rgba(100,120,255,.1)",border:"1px solid #334",borderRadius:8,color:"#778",padding:"4px 11px",fontSize:"0.74rem"}}>← 戻る</button>
              <span style={{fontSize:"1rem"}}>{activeSection.icon}</span>
              <span style={{fontWeight:700,color:activeSection.color}}>{activeSection.label}</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:10}}>
              <div className="ch" onClick={()=>startQuiz(activeSection,"normal")}
                style={{background:`linear-gradient(135deg,${activeSection.color}22,${activeSection.color}08)`,border:`1px solid ${activeSection.color}44`,borderRadius:13,padding:"18px 20px",display:"flex",alignItems:"center",gap:14}}>
                <span style={{fontSize:"1.8rem"}}>📝</span>
                <div>
                  <div style={{fontWeight:700,fontSize:"1rem"}}>全問チャレンジ</div>
                  <div style={{fontSize:"0.72rem",color:"#778",marginTop:2}}>全{activeSection.questions.length}問 ランダム出題</div>
                </div>
                <div style={{marginLeft:"auto",color:activeSection.color,fontSize:"1.2rem"}}>▶</div>
              </div>
              {wrongList.length > 0 && (
                <div className="ch" onClick={()=>startQuiz(activeSection,"wrong")}
                  style={{background:"linear-gradient(135deg,rgba(192,57,43,.18),rgba(192,57,43,.05))",border:"1px solid #c0392b44",borderRadius:13,padding:"18px 20px",display:"flex",alignItems:"center",gap:14}}>
                  <span style={{fontSize:"1.8rem"}}>❌</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:"1rem"}}>間違えた問題だけ</div>
                    <div style={{fontSize:"0.72rem",color:"#f08080",marginTop:2}}>{wrongList.length}問</div>
                  </div>
                  <div style={{marginLeft:"auto",color:"#c0392b",fontSize:"1.2rem"}}>▶</div>
                </div>
              )}
            </div>
          </div>
        )}

        {/* QUIZ */}
        {screen==="quiz" && idx < deck.length && (
          <div style={{animation:"fadeIn 0.35s ease"}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
              <span style={{fontSize:"0.9rem"}}>{activeSection.icon}</span>
              <span style={{fontSize:"0.77rem",color:color,fontWeight:600}}>{activeSection.label}</span>
              <button className="fb" onClick={()=>setScreen("section")} style={{marginLeft:"auto",background:"rgba(100,120,255,.1)",border:"1px solid #334",borderRadius:8,color:"#778",padding:"4px 10px",fontSize:"0.73rem"}}>← 中断</button>
            </div>
            <div style={{height:4,background:"#1a1a35",borderRadius:4,marginBottom:14,overflow:"hidden"}}>
              <div style={{height:"100%",width:`${(idx/total)*100}%`,background:`linear-gradient(90deg,${color},${color}88)`,transition:"width 0.4s",borderRadius:4}} />
            </div>
            {/* 問題 */}
            <div style={{background:"linear-gradient(135deg,rgba(18,20,44,.97),rgba(22,25,52,.9))",border:`1px solid ${color}33`,borderRadius:16,padding:"20px 18px",marginBottom:14}}>
              <div style={{fontSize:"0.68rem",color:"#445",marginBottom:8}}>Q{idx+1}.</div>
              <p style={{margin:0,fontSize:"1.0rem",lineHeight:1.85,color:"#d8d8f0",fontWeight:500}}>{deck[idx].q}</p>
            </div>
            {/* 選択肢 */}
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {deck[idx]._choices.map((ch,i)=>{
                const answered = selected!==null;
                const isRight = ch===deck[idx].a;
                const isSel = selected===ch;
                let bg="rgba(18,20,44,.85)",border="1px solid #252545",col="#ccd";
                if(answered){
                  if(isRight){bg="rgba(39,174,96,.18)";border="1px solid #27ae6077";col="#7ef0a8";}
                  else if(isSel){bg="rgba(192,57,43,.18)";border="1px solid #c0392b77";col="#f08080";}
                }
                return (
                  <div key={i} className={answered?"":"cb"} onClick={()=>handleChoice(ch)}
                    style={{background:bg,border,borderRadius:11,padding:"13px 15px",color:col,display:"flex",alignItems:"center",gap:10,fontSize:"0.9rem",opacity:answered&&!isRight&&!isSel?.38:1}}>
                    <span style={{width:26,height:26,borderRadius:7,flexShrink:0,background:answered?(isRight?"#27ae60":isSel?"#c0392b":"#1a1a35"):"#1a1a35",border:answered?"none":"1px solid #334",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"0.75rem",fontWeight:700,color:answered?"#fff":"#556"}}>
                      {answered?(isRight?"○":isSel?"✕":""):["A","B","C","D"][i]}
                    </span>
                    {ch}
                  </div>
                );
              })}
            </div>
            {/* 正誤 + 解説 */}
            {selected!==null && (
              <div>
                <div style={{background:selected===deck[idx].a?"rgba(39,174,96,.11)":"rgba(192,57,43,.11)",border:`1px solid ${selected===deck[idx].a?"#27ae60":"#c0392b"}55`,borderRadius:12,padding:"12px 15px",marginBottom:10,animation:"fadeIn 0.25s ease"}}>
                  <div style={{fontWeight:700,fontSize:"1rem",marginBottom:showExp?6:0,color:selected===deck[idx].a?"#7ef0a8":"#f08080"}}>
                    {selected===deck[idx].a?"🎉 正解！":`😅 不正解… 正解は「${deck[idx].a}」`}
                  </div>
                  {showExp && <p style={{margin:0,fontSize:"0.82rem",color:"#aab",lineHeight:1.75}}>{deck[idx].exp}</p>}
                </div>
                {!showExp && (
                  <button className="fb" onClick={()=>setShowExp(true)} style={{width:"100%",padding:"10px",borderRadius:10,background:"rgba(100,120,255,.1)",border:"1px dashed rgba(100,120,255,.25)",color:"#8899cc",fontSize:"0.82rem",marginBottom:8}}>
                    解説を見る 📖
                  </button>
                )}
                <button className="fb" onClick={goNext} style={{width:"100%",padding:"13px",borderRadius:12,background:`linear-gradient(135deg,${color},${color}bb)`,border:"none",color:"#fff",fontWeight:700,fontSize:"0.95rem",animation:"pulse 2s infinite"}}>
                  {idx+1>=total?"結果を見る 🏆":"次へ →"}
                </button>
              </div>
            )}
          </div>
        )}

        {/* RESULT */}
        {screen==="result" && (
          <div style={{animation:"fadeIn 0.4s ease",textAlign:"center",paddingTop:20}}>
            <div style={{fontSize:"3.5rem",marginBottom:10}}>{score.ok/total>=0.8?"🏆":score.ok/total>=0.5?"👍":"📚"}</div>
            <h2 style={{fontSize:"1.3rem",fontWeight:900,marginBottom:5,color:color}}>{activeSection.label} 完了！</h2>
            <p style={{fontSize:"2rem",fontWeight:900,marginBottom:4}}>{score.ok}<span style={{fontSize:"0.95rem",color:"#778"}}> / {total} 問正解</span></p>
            <p style={{color:"#aab",fontSize:"0.85rem",marginBottom:6}}>正解率 {Math.round((score.ok/total)*100)}%</p>
            {wrongList.length>0 && (
              <p style={{color:"#f08080",fontSize:"0.82rem",marginBottom:22}}>❌ {wrongList.length}問間違えました。復習しましょう！</p>
            )}
            {wrongList.length===0 && <p style={{color:"#7ef0a8",fontSize:"0.82rem",marginBottom:22}}>🎉 全問正解！完璧です！</p>}
            <div style={{display:"flex",gap:9,justifyContent:"center",flexWrap:"wrap"}}>
              <button className="fb" onClick={()=>startQuiz(activeSection,"normal")} style={{padding:"11px 18px",borderRadius:11,background:`linear-gradient(135deg,${color},${color}99)`,border:"none",color:"#fff",fontWeight:700,fontSize:"0.88rem"}}>もう一度</button>
              {wrongList.length>0 && (
                <button className="fb" onClick={()=>startQuiz(activeSection,"wrong")} style={{padding:"11px 18px",borderRadius:11,background:"rgba(192,57,43,.25)",border:"1px solid #c0392b55",color:"#f08080",fontWeight:700,fontSize:"0.88rem"}}>❌ 間違えた問題だけ</button>
              )}
              <button className="fb" onClick={()=>setScreen("home")} style={{padding:"11px 18px",borderRadius:11,background:"rgba(50,50,70,.5)",border:"1px solid #334",color:"#778",fontWeight:700,fontSize:"0.88rem"}}>← 分野選択</button>
            </div>
          </div>
        )}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
